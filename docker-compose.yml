services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caderno
      POSTGRES_PASSWORD: caderno
      POSTGRES_DB: caderno
    ports:
      - "5435:5432"
    volumes:
      - caderno_postgres_data:/var/lib/postgresql/data

volumes:
  caderno_postgres_data:
